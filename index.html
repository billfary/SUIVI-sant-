<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Suivi santé V3.3</title><style>
:root{--bg:#f3f6fa;--ink:#172033;--line:#cbd5e1;--blue:#1976d2;--green:#39aa45;--orange:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui}button,input,select,textarea{font:inherit}header{height:44px;padding:12px;background:#142239;color:#fff;font-weight:800}.page{display:none;padding:7px 7px 70px;max-width:760px;margin:auto}.page.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px}h2{margin:0 0 6px}.lab{font-size:9px;font-weight:900;color:#687386;margin:4px 0 2px}.grid{display:grid;gap:5px}.g4{grid-template-columns:repeat(4,1fr)}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice,.quick,.field{min-height:34px;border:1px solid #b5c5d8;border-radius:8px;background:#fff;padding:5px}.choice,.quick{font-size:11px;font-weight:800}.active{background:#172033!important;color:#fff!important}.field{width:100%}.hide{display:none}.primary{width:100%;height:37px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:900}.nav{position:fixed;bottom:0;inset-inline:0;height:62px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav button{border:0;background:#fff;color:#687386;font-size:8px}.nav b{display:block;font-size:18px}.nav .on{color:var(--blue);font-weight:900}.preview,.metric{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}.preview{margin:5px 0}.follow{display:grid;grid-template-columns:.62fr .88fr 1.05fr .68fr .9fr .45fr;gap:3px;align-items:center;border:1px solid var(--line);border-left:7px solid var(--pc);border-radius:9px;padding:5px 3px;margin:5px 0;font-size:9px}.follow input{width:100%;min-width:0;padding:5px 2px}.ok{height:29px;border:0;border-radius:6px;background:#199447;color:#fff}.donut{width:min(62vw,245px);aspect-ratio:1;border-radius:50%;margin:8px auto;display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:19%;background:#fff;border-radius:50%}.center{z-index:1;text-align:center}.center strong{display:block;font-size:29px}.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.metric small{display:block;color:#687386;min-height:24px}.last{display:grid;grid-template-columns:2fr 1fr;gap:5px;margin-top:5px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}.filter{border:2px solid var(--pc);border-radius:7px;background:#fff;padding:5px}.filter.on{background:var(--pc);color:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.dow,.day{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}.dow{min-height:25px;padding:5px;background:#eef2f7;font-size:10px;font-weight:900}.day{min-height:45px;position:relative;background:#fff}.day i{position:absolute;inset:0}.day span{position:relative;background:#fffddd;border-radius:4px;padding:1px 4px}.journal{border:1px solid var(--line);border-left:8px solid var(--pc);border-radius:9px;padding:8px;margin:6px 0}.jtop{display:grid;grid-template-columns:1.2fr .7fr 1fr;gap:4px;font-weight:900}.jcomment{margin:5px 0;color:#526071}.actions{display:flex;gap:6px}.actions button{flex:1;border:0;border-radius:7px;padding:6px;font-weight:800}.edit{background:#e8f1ff;color:#1756a9}.delete{background:#fee2e2;color:#b91c1c}.empty{text-align:center;color:#687386;padding:24px}dialog{border:0;border-radius:13px;width:min(92vw,430px)}.dlgBtns{display:flex;gap:6px;margin-top:8px}.dlgBtns button{flex:1}.danger{background:#dc2626}.detail{border-left:8px solid var(--pc);padding:8px;margin:5px 0;background:#f8fafc;border-radius:8px}
@media(max-height:720px){header{height:40px}.page{padding-top:4px}.choice,.quick{min-height:28px;font-size:10px}.lab{margin:2px 0 1px}textarea{height:30px}.donut{width:min(38vh,210px)}}
</style></head><body><header>Suivi santé V3.3</header>
<section id="saisie" class="page on"><div class="card"><h2>Saisie</h2><div class="lab">QUI</div><div id="people" class="grid g4"></div><div class="lab">QUOI</div><div id="pros" class="grid g4"></div><div class="lab">DATE</div><div class="grid g4"><button class="quick dq" data-o="0">Aujourd'hui</button><button class="quick dq" data-o="-1">Hier</button><button class="quick dq" data-o="1">Demain</button><button id="od" class="quick">Autre</button></div><input id="date" type="date" class="field hide"><div class="lab">FRAIS</div><div class="grid g4"><button class="quick aq" data-a="110">110 $</button><button class="quick aq" data-a="120">120 $</button><button class="quick aq" data-a="150">150 $</button><button id="oa" class="quick">Autre</button></div><input id="amount" type="number" class="field hide"><div class="lab">COMMENTAIRE</div><textarea id="comment" class="field" rows="1"></textarea><div id="preview" class="preview">Choisis les informations.</div><button id="add" class="primary">AJOUTER</button></div></section>
<section id="suivi" class="page"><div class="card"><h2>Suivi</h2><div id="count"></div><div id="follow"></div></div></section>
<section id="enveloppe" class="page"><div class="card"><h2>Enveloppe</h2><div class="row"><select id="envPerson" class="field"></select><select id="envPro" class="field"></select></div><div id="donut" class="donut"><div class="center"><strong id="remaining">0 $</strong><span id="fees">(0 $)</span></div></div><div style="text-align:center;font-size:10px">🟢 Reste　🟠 En attente　🔴 Validé</div><div class="sim"><div class="metric"><small>FRAIS SÉANCE</small><input id="sessionFee" type="number" class="field"></div><div class="metric"><small>NB SÉANCES</small><strong id="sessionCount">0</strong></div><div class="metric"><small>RESTE</small><strong id="sessionRest">0 $</strong></div></div><div class="last"><div class="metric"><small>DERNIER RDV</small><strong id="lastDate">Aucun</strong></div><div class="metric"><small>DEPUIS</small><strong id="daysAgo">-</strong></div></div></div></section>
<section id="mensuel" class="page"><div class="card"><h2>Mensuel</h2><div class="row"><select id="month" class="field"></select><select id="year" class="field"></select></div><div id="filters" class="filters"></div><div id="monthGrid"></div></div></section>
<section id="journalier" class="page"><div class="card"><h2>Journalier</h2><div class="row"><select id="jPerson" class="field"></select><select id="jPro" class="field"></select></div><div id="journalList"></div></div></section>
<nav class="nav"><button data-page="saisie" class="on"><b>✚</b>SAISIE</button><button data-page="suivi"><b>✓</b>SUIVI</button><button data-page="enveloppe"><b>◉</b>ENVELOPPE</button><button data-page="mensuel"><b>▦</b>MENSUEL</button><button data-page="journalier"><b>☷</b>JOURNALIER</button></nav>
<dialog id="dayDialog"><h3 id="dayTitle"></h3><div id="dayContent"></div><button class="primary" onclick="dayDialog.close()">Fermer</button></dialog>
<dialog id="editDialog"><h3>Modifier le rendez-vous</h3><input id="editDate" type="date" class="field"><input id="editPaid" type="number" class="field" placeholder="Frais" style="margin-top:6px"><input id="editReimb" type="number" class="field" placeholder="Remboursement" style="margin-top:6px"><textarea id="editComment" class="field" rows="3" placeholder="Commentaire" style="margin-top:6px"></textarea><div class="dlgBtns"><button class="quick" onclick="editDialog.close()">Annuler</button><button id="saveEdit" class="primary">Enregistrer</button></div></dialog>
<script>
'use strict';function iso(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function el(x){return document.getElementById(x)}var P=[['BF','#2387f5'],['CDW','#ef69b9'],['ADAM','#53b94a'],['AARON','#ff8a28']],PROS=['MASSO','NATURO','OSTEO','PSY','CHIRO','DENT','PHYSIO','X'],SET={MASSO:800,NATURO:800,OSTEO:800,PSY:1500,CHIRO:800,DENT:1500,PHYSIO:800,X:800};var H=[['CDW','PHYSIO','perinal','2026-05-04',170],['ADAM','MASSO','bf royal','2026-05-20',150],['CDW','MASSO','kdo','2026-05-08',110],['CDW','MASSO','kdo','2026-05-21',110],['CDW','MASSO','kdo','2026-06-05',110],['CDW','MASSO','kdo','2026-07-13',110],['AARON','MASSO','bf barre','2026-06-14',60],['AARON','MASSO','bf barre','2026-06-21',60],['AARON','MASSO','bf barre','2026-06-26',60],['AARON','MASSO','bf barre','2026-07-06',60],['ADAM','MASSO','bf royal','2026-07-24',150],['ADAM','MASSO','bf royal','2026-07-11',150],['BF','MASSO','laval jess','2026-08-09',80],['AARON','MASSO','bf barre','2026-07-20',90],['AARON','MASSO','bf barre','2026-08-07',90],['AARON','MASSO','bf barre','2026-08-21',90],['BF','NATURO','bank masso','2026-07-15',110],['CDW','NATURO','bank masso','2026-07-15',110],['ADAM','NATURO','bank masso','2026-07-15',110],['AARON','NATURO','bank masso','2026-07-15',110],['BF','NATURO','bank masso','2026-08-13',110],['CDW','NATURO','bank masso','2026-08-13',110],['ADAM','NATURO','bank masso','2026-08-13',110],['AARON','NATURO','bank masso','2026-08-13',110],['ADAM','MASSO','bf royal','2026-08-29',150],['BF','MASSO','new russe','2026-09-04',100],['CDW','MASSO','KDO','2026-09-04',120],['CDW','NATURO','CYRIL','2026-09-03',120]],KEY='suiviSanteV3';function fresh(){return{appointments:H.map((x,i)=>({id:'h'+i,person:x[0],professional:x[1],comment:x[2],date:x[3],paid:x[4],reimbursement:+(x[4]*.8).toFixed(2),status:'pending'}))}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.appointments))return x}catch(e){}return fresh()}let data=load(),entry={person:'',professional:'',date:iso(),paid:0},visible=new Set(P.map(x=>x[0])),editId=null;const money=x=>(+x||0).toLocaleString('fr-CA',{maximumFractionDigits:2})+' $',pc=n=>(P.find(x=>x[0]===n)||P[0])[1],reimb=x=>+(x*.8).toFixed(2),save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function choices(){people.innerHTML=P.map(x=>`<button class="choice ${entry.person===x[0]?'active':''}" data-v="${x[0]}">${x[0]}</button>`).join('');pros.innerHTML=PROS.map(x=>`<button class="choice ${entry.professional===x?'active':''}" data-v="${x}">${x}</button>`).join('');people.querySelectorAll('button').forEach(b=>b.onclick=()=>{entry.person=b.dataset.v;choices();preview()});pros.querySelectorAll('button').forEach(b=>b.onclick=()=>{entry.professional=b.dataset.v;choices();preview()})}function preview(){el('preview').textContent=entry.person&&entry.professional&&entry.paid?'Remboursement attendu : '+money(reimb(entry.paid)):'Choisis les informations.'}function addOne(){if(!entry.person||!entry.professional||!entry.paid)return alert('Complète la saisie');data.appointments.push({id:'n'+Date.now(),person:entry.person,professional:entry.professional,date:entry.date,paid:entry.paid,comment:comment.value,reimbursement:reimb(entry.paid),status:'pending'});save();entry={person:'',professional:'',date:iso(),paid:0};comment.value=amount.value='';renderAll()}
function followR(){let a=data.appointments.filter(x=>x.status==='pending').sort((a,b)=>b.date.localeCompare(a.date));count.textContent=a.length+' remboursement(s) en attente';follow.innerHTML=a.map(x=>`<div class="follow" style="--pc:${pc(x.person)}" data-id="${x.id}"><b>${x.person}</b><b>${x.professional}</b><span>${x.date}</span><span>${money(x.paid)}</span><input type="number" value="${x.reimbursement}"><button class="ok">OK</button></div>`).join('')||'<div class="empty">Aucun remboursement en attente.</div>';follow.querySelectorAll('.follow').forEach(r=>{let a=data.appointments.find(x=>x.id===r.dataset.id),i=r.querySelector('input');i.onchange=()=>{a.reimbursement=Math.max(0,+i.value||0);save();envR()};r.querySelector('button').onclick=()=>{a.reimbursement=Math.max(0,+i.value||0);a.status='validated';save();renderAll()}})}function envR(){let p=envPerson.value||'BF',pr=envPro.value||'MASSO',a=data.appointments.filter(x=>x.person===p&&x.professional===pr),pe=a.filter(x=>x.status==='pending').reduce((s,x)=>s+(+x.reimbursement||0),0),va=a.filter(x=>x.status==='validated').reduce((s,x)=>s+(+x.reimbursement||0),0),ini=SET[pr],rem=Math.max(0,ini-pe-va),g=rem/ini*100,o=pe/ini*100;remaining.textContent=money(rem);fees.textContent='('+money(rem/.8)+')';donut.style.background=`conic-gradient(var(--green) 0 ${g}%,var(--orange) ${g}% ${g+o}%,var(--red) ${g+o}% 100%)`;let f=+sessionFee.value||0,per=f?reimb(f):0,n=per?Math.floor(rem/per):0;sessionCount.textContent=n;sessionRest.textContent=money(rem-n*per);let d=a.map(x=>x.date).sort().reverse()[0];lastDate.textContent=d||'Aucun';daysAgo.textContent=d?Math.max(0,Math.floor((new Date(iso())-new Date(d+'T00:00:00'))/86400000))+' jours':'-'}
const MON=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];function filtersR(){filters.innerHTML=P.map(x=>`<button class="filter ${visible.has(x[0])?'on':''}" style="--pc:${x[1]}" data-v="${x[0]}">${x[0]}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{visible.has(b.dataset.v)?visible.delete(b.dataset.v):visible.add(b.dataset.v);filtersR();monthR()})}function monthR(){let y=+year.value,m=+month.value,f=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),h=['L','M','M','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`);for(let i=0;i<42;i++){let n=i-f+1;if(n<1||n>nd){h.push('<div class="day"></div>');continue}let d=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,a=data.appointments.filter(x=>x.date===d&&visible.has(x.person)),cs=[...new Set(a.map(x=>pc(x.person)))],bg=cs.length?`conic-gradient(${cs.map((c,j)=>`${c} ${j/cs.length*100}% ${(j+1)/cs.length*100}%`).join(',')})`:'#fff';h.push(`<button class="day" data-d="${d}"><i style="background:${bg}"></i><span>${n}</span></button>`)}monthGrid.innerHTML=`<div class="calendar">${h.join('')}</div>`;monthGrid.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let a=data.appointments.filter(x=>x.date===b.dataset.d);dayTitle.textContent=b.dataset.d;dayContent.innerHTML=a.map(x=>`<div class="detail" style="--pc:${pc(x.person)}"><b>${x.person}</b> - ${x.professional}</div>`).join('')||'Aucun rendez-vous';dayDialog.showModal()})}
function journalR(){let a=data.appointments.filter(x=>(!jPerson.value||x.person===jPerson.value)&&(!jPro.value||x.professional===jPro.value)).sort((a,b)=>a.date.localeCompare(b.date));journalList.innerHTML=a.map(x=>`<div class="journal" style="--pc:${pc(x.person)}"><div class="jtop"><span>${x.date}</span><span>${x.person}</span><span>${x.professional}</span></div><div class="jcomment">${x.comment||'Aucun commentaire'}</div><div class="actions"><button class="edit" data-edit="${x.id}">Modifier</button><button class="delete" data-del="${x.id}">Supprimer</button></div></div>`).join('')||'<div class="empty">Aucun rendez-vous.</div>';journalList.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));journalList.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteOne(b.dataset.del))}function openEdit(id){let a=data.appointments.find(x=>x.id===id);editId=id;editDate.value=a.date;editPaid.value=a.paid;editReimb.value=a.reimbursement;editComment.value=a.comment||'';editDialog.showModal()}function deleteOne(id){if(confirm('Supprimer ce rendez-vous ?')){data.appointments=data.appointments.filter(x=>x.id!==id);save();renderAll()}}saveEdit.onclick=()=>{let a=data.appointments.find(x=>x.id===editId);a.date=editDate.value;a.paid=Math.max(0,+editPaid.value||0);a.reimbursement=Math.max(0,+editReimb.value||0);a.comment=editComment.value.trim();save();editDialog.close();renderAll()};
function renderAll(){choices();preview();followR();envR();filtersR();monthR();journalR()}function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.page===p));if(p==='journalier')journalR();scrollTo(0,0)}function init(){date.value=entry.date;envPerson.innerHTML=P.map(x=>`<option>${x[0]}</option>`);envPro.innerHTML=PROS.map(x=>`<option>${x}</option>`);jPerson.innerHTML='<option value="">TOUS : QUI</option>'+P.map(x=>`<option>${x[0]}</option>`).join('');jPro.innerHTML='<option value="">TOUS : QUOI</option>'+PROS.map(x=>`<option>${x}</option>`).join('');month.innerHTML=MON.map((x,i)=>`<option value="${i}">${x}</option>`);let cy=new Date().getFullYear();year.innerHTML=Array.from({length:9},(_,i)=>`<option>${cy-4+i}</option>`);month.value=new Date().getMonth();year.value=cy;document.querySelectorAll('.dq').forEach(b=>b.onclick=()=>{let d=new Date();d.setDate(d.getDate()+ +b.dataset.o);entry.date=iso(d);date.value=entry.date});od.onclick=()=>date.classList.toggle('hide');date.onchange=()=>entry.date=date.value;document.querySelectorAll('.aq').forEach(b=>b.onclick=()=>{entry.paid=+b.dataset.a;preview()});oa.onclick=()=>amount.classList.toggle('hide');amount.oninput=()=>{entry.paid=+amount.value||0;preview()};add.onclick=addOne;envPerson.onchange=envPro.onchange=sessionFee.oninput=envR;month.onchange=year.onchange=monthR;jPerson.onchange=jPro.onchange=journalR;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));renderAll()}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
