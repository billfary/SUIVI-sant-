'use strict';const $=x=>document.getElementById(x),KEY='suiviSanteV3',P=[['BF','#2387f5'],['CDW','#ef69b9'],['ADAM','#53b94a'],['AARON','#ff8a28']],DEFAULT=[['MASSO','M',800],['NATURO','N',800],['OSTEO','O',800],['PSY','Ψ',1500],['CHIRO','C',800],['DENT','D',1500],['PHYSIO','P',800],['AUTRE','X',800]].map(x=>({name:x[0],letter:x[1],initial:x[2],rate:80,cap:0,group:''}));function iso(d=new Date()){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}let D=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.appointments){x.pros=x.pros||DEFAULT;x.pros.forEach(p=>{if(p.name==='X')p.name='AUTRE'});x.appointments.forEach(a=>{if(a.professional==='X')a.professional='AUTRE'});return x}}catch(e){}return{appointments:[],pros:DEFAULT}})(),E={person:'',professional:'',date:iso(),paid:0},visible=new Set(P.map(x=>x[0])),selectedId,editId;const save=()=>localStorage.setItem(KEY,JSON.stringify(D)),money=x=>(+x||0).toLocaleString('fr-CA',{maximumFractionDigits:2})+' $',pc=n=>(P.find(x=>x[0]===n)||P[0])[1],gp=n=>D.pros.find(x=>x.name===n)||D.pros[0],calc=(a,p)=>+((p.cap?Math.min(a,p.cap):a)*p.rate/100).toFixed(2);
function selects(){let ev=$('envPro').value,jv=$('jPro').value;$('envPerson').innerHTML=P.map(x=>`<option>${x[0]}</option>`).join('');$('envPro').innerHTML=D.pros.map(x=>`<option>${x.name}</option>`).join('');$('jPerson').innerHTML='<option value="">TOUS : QUI</option>'+P.map(x=>`<option>${x[0]}</option>`).join('');$('jPro').innerHTML='<option value="">TOUS : QUOI</option>'+D.pros.map(x=>`<option>${x.name}</option>`).join('');if(ev)$('envPro').value=ev;if(jv)$('jPro').value=jv}function choices(){$('people').innerHTML=P.map(x=>`<button class="choice ${E.person===x[0]?'active':''}" data-v="${x[0]}">${x[0]}</button>`).join('');$('pros').innerHTML=D.pros.map(x=>`<button class="choice ${E.professional===x.name?'active':''}" data-v="${x.name}">${x.name}</button>`).join('');$('people').querySelectorAll('button').forEach(b=>b.onclick=()=>{E.person=b.dataset.v;choices();preview()});$('pros').querySelectorAll('button').forEach(b=>b.onclick=()=>{E.professional=b.dataset.v;choices();preview()})}function preview(){if(E.person&&E.professional&&E.paid){$('refundPreview').classList.remove('hide');$('refundPreview').textContent='Remboursement attendu : '+money(calc(E.paid,gp(E.professional)))}else $('refundPreview').classList.add('hide')}

function openDay(d){let a=D.appointments.filter(x=>x.date===d);$('dayTitle').textContent=d;$('dayContent').innerHTML=a.map(x=>`<div style="border-left:8px solid ${pc(x.person)};padding:8px;margin:5px"><b>${x.person}</b> - ${x.professional}</div>`).join('')||'Aucun';$('dayDialog').showModal()}function annual(scroll=true){let y=+$('annualYear').value,d=new Date(y,0,1),h='',lastMonth=-1;while(d.getFullYear()===y){let z=iso(d);if(d.getMonth()!==lastMonth){lastMonth=d.getMonth();h+=`<div class="annualMonth">${MON[lastMonth]}</div>`}let a=D.appointments.filter(x=>x.date===z);h+=`<div class="annualRow ${z===iso()?'today':''}" id="day-${z}" data-d="${z}"><b>${['D','L','M','M','J','V','S'][d.getDay()]}</b><span>${d.toLocaleDateString('fr-CA',{day:'numeric',month:'short'})}</span><span class="letters">${a.map(x=>`<b class="letter" style="--pc:${pc(x.person)}">${gp(x.professional).letter||'X'}</b>`).join('')}</span></div>`;d.setDate(d.getDate()+1)}$('annualList').innerHTML=h;$('annualList').querySelectorAll('[data-d]').forEach(r=>r.onclick=()=>openDay(r.dataset.d));if(scroll&&y===new Date().getFullYear())requestAnimationFrame(()=>document.getElementById('day-'+iso())?.scrollIntoView({block:'center'}))}

function settings(){$('settingsRows').innerHTML=D.pros.map((p,i)=>`<div class="srow" data-i="${i}"><input data-k="name" value="${p.name}"><input data-k="letter" maxlength="2" value="${p.letter}"><input data-k="initial" type="number" value="${p.initial}"><input data-k="rate" type="number" value="${p.rate}"><input data-k="cap" value="${p.cap||'X'}"><input data-k="group" maxlength="2" value="${p.group}"><button class="xbtn">×</button></div>`).join('');$('settingsRows').querySelectorAll('.srow').forEach(r=>{r.querySelectorAll('input').forEach(i=>i.onchange=()=>{let p=D.pros[+r.dataset.i],k=i.dataset.k,old=p.name;p[k]=k==='cap'?(i.value.toUpperCase()==='X'?0:+i.value||0):['initial','rate'].includes(k)?+i.value||0:i.value.toUpperCase();if(k==='name')D.appointments.forEach(a=>{if(a.professional===old)a.professional=p.name});save();render()});r.querySelector('button').onclick=()=>{D.pros.splice(+r.dataset.i,1);save();render()}})}
function render(){selects();choices();preview();follow();envelope();month();annual(false);journal();settings()}function init(){let cy=new Date().getFullYear();$('month').innerHTML=MON.map((x,i)=>`<option value="${i}">${x}</option>`);$('month').value=new Date().getMonth();[$('year'),$('annualYear')].forEach(s=>{s.innerHTML=Array.from({length:9},(_,i)=>`<option>${cy-4+i}</option>`);s.value=cy});$('filters').innerHTML=P.map(x=>`<button class="filter on" style="--pc:${x[1]}" data-v="${x[0]}">${x[0]}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{visible.has(b.dataset.v)?visible.delete(b.dataset.v):visible.add(b.dataset.v);b.classList.toggle('on');month()});document.querySelectorAll('.dq').forEach(b=>b.onclick=()=>{let d=new Date();d.setDate(d.getDate()+ +b.dataset.o);E.date=iso(d);$('date').value=E.date});$('od').onclick=()=>$('date').classList.toggle('hide');$('date').onchange=()=>E.date=$('date').value;document.querySelectorAll('.aq').forEach(b=>b.onclick=()=>{E.paid=+b.dataset.a;preview()});$('oa').onclick=()=>$('amount').classList.toggle('hide');$('amount').oninput=()=>{E.paid=+$('amount').value||0;preview()};$('add').onclick=()=>{if(!E.person||!E.professional||!E.paid)return alert('Complète la saisie');D.appointments.push({id:'n'+Date.now(),person:E.person,professional:E.professional,date:E.date,paid:E.paid,comment:$('comment').value,reimbursement:calc(E.paid,gp(E.professional)),status:'pending'});save();E={person:'',professional:'',date:iso(),paid:0};$('comment').value='';render()};$('menuCancel').onclick=()=>$('actionMenu').classList.remove('show');$('menuEdit').onclick=()=>{$('actionMenu').classList.remove('show');edit(selectedId)};$('menuDelete').onclick=()=>{if(confirm('Supprimer ce rendez-vous ?')){D.appointments=D.appointments.filter(x=>x.id!==selectedId);save();render()}$('actionMenu').classList.remove('show')};$('saveEdit').onclick=()=>{let a=D.appointments.find(x=>x.id===editId);a.date=$('editDate').value;a.paid=+$('editPaid').value||0;a.reimbursement=+$('editReimb').value||0;a.comment=$('editComment').value;save();$('editDialog').close();render()};$('addPro').onclick=()=>{D.pros.push({name:'NOUVEAU',letter:'X',initial:800,rate:80,cap:0,group:''});save();render()};$('exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='sauvegarde-sante.json';a.click()};$('importFile').onchange=e=>{let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render()}catch(x){alert('Fichier invalide')}};r.readAsText(e.target.files[0])};$('envPerson').onchange=$('envPro').onchange=$('sessionFee').oninput=envelope;$('month').onchange=$('year').onchange=month;$('annualYear').onchange=()=>annual(true);$('jPerson').onchange=$('jPro').onchange=journal;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.p==='annuel')annual(true);scrollTo(0,0)});$('date').value=E.date;render()}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
