<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Suivi sante V3.2</title><style>
:root{--bg:#f3f6fa;--ink:#172033;--line:#c6d1df;--blue:#1976d2;--green:#39aa45;--orange:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}header{height:45px;padding:12px;background:#142239;color:#fff;font-weight:800}.page{display:none;max-width:760px;margin:auto;padding:7px 7px 70px}.page.on{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px}h2{margin:0 0 6px;font-size:19px}.lab{font-size:9px;font-weight:900;color:#687386;margin:4px 0 2px}.grid{display:grid;gap:5px}.g4{grid-template-columns:repeat(4,1fr)}.choice,.quick,.field{min-height:34px;border:1px solid #b5c5d8;border-radius:8px;background:#fff;padding:5px}.choice,.quick{font-size:11px;font-weight:800}.active{background:#172033!important;color:#fff!important}.field{width:100%}.hide{display:none}.add{width:100%;height:37px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:900}.preview,.metric{border:1px solid #d2dae5;border-radius:8px;padding:6px;text-align:center}.preview{margin:5px 0;font-size:12px}.nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav button{border:0;background:#fff;color:#687386;font-size:9px}.nav b{display:block;font-size:19px}.nav .on{color:var(--blue);font-weight:900}.follow{display:grid;grid-template-columns:.62fr .88fr 1.05fr .68fr .9fr .45fr;gap:3px;align-items:center;border:1px solid #d2dae5;border-left:7px solid var(--pc);border-radius:9px;padding:5px 3px;margin:5px 0;font-size:9px}.follow input{width:100%;min-width:0;padding:5px 2px}.ok{height:29px;border:0;border-radius:6px;background:#199447;color:#fff;font-weight:900}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.donut{width:min(62vw,250px);aspect-ratio:1;border-radius:50%;margin:9px auto;display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:19%;background:#fff;border-radius:50%}.center{z-index:1;text-align:center}.center strong{display:block;font-size:30px}.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.metric small{display:block;color:#687386;min-height:25px}.last{display:grid;grid-template-columns:2fr 1fr;gap:5px;margin-top:5px}.legend{text-align:center;font-size:10px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0}.filter{border:2px solid var(--pc);border-radius:7px;background:#fff;padding:5px;font-weight:800}.filter.on{background:var(--pc);color:#fff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.dow,.day{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}.dow{min-height:25px;padding:5px;background:#eef2f7;font-size:10px;font-weight:900}.day{min-height:clamp(44px,10vw,70px);position:relative;background:#fff;padding:3px}.day .bg{position:absolute;inset:0}.day .num{position:relative;background:#ffffffd9;border-radius:5px;padding:1px 4px;font-weight:800}.empty{text-align:center;color:#687386;padding:24px}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#172033;color:#fff;padding:8px 14px;border-radius:20px;display:none}.toast.show{display:block}dialog{border:0;border-radius:13px;width:min(92vw,430px)}.detail{border-left:8px solid var(--pc);padding:9px;margin:6px 0;background:#f8fafc;border-radius:8px}
@media(max-height:720px){header{height:40px}.page{padding-top:4px}.choice,.quick{min-height:28px;font-size:10px}.lab{margin:2px 0 1px}textarea{height:30px}.donut{width:min(39vh,215px)}}
</style></head><body><header>Suivi sante V3.2</header>
<section id="saisie" class="page on"><div class="card"><h2>Saisie</h2><div class="lab">QUI</div><div id="people" class="grid g4"></div><div class="lab">QUOI</div><div id="pros" class="grid g4"></div><div class="lab">DATE</div><div class="grid g4"><button class="quick dq" data-o="0">Aujourd'hui</button><button class="quick dq" data-o="-1">Hier</button><button class="quick dq" data-o="1">Demain</button><button id="od" class="quick">Autre</button></div><input id="date" type="date" class="field hide"><div class="lab">FRAIS</div><div class="grid g4"><button class="quick aq" data-a="110">110 $</button><button class="quick aq" data-a="120">120 $</button><button class="quick aq" data-a="150">150 $</button><button id="oa" class="quick">Autre</button></div><input id="amount" type="number" class="field hide" placeholder="Montant"><div class="lab">COMMENTAIRE</div><textarea id="comment" class="field" rows="1"></textarea><div id="preview" class="preview">Choisis les informations.</div><button id="add" class="add">AJOUTER</button></div></section>
<section id="suivi" class="page"><div class="card"><h2>Suivi</h2><div id="count" style="font-size:11px;color:#687386"></div><div id="follow"></div></div></section>
<section id="enveloppe" class="page"><div class="card"><h2>Enveloppe</h2><div class="row"><select id="envPerson" class="field"></select><select id="envPro" class="field"></select></div><div id="donut" class="donut"><div class="center"><strong id="remaining">0 $</strong><span id="fees">(0 $)</span></div></div><div class="legend">🟢 Reste &nbsp; 🟠 En attente &nbsp; 🔴 Valide</div><div class="sim"><div class="metric"><small>FRAIS SEANCE</small><input id="sessionFee" type="number" class="field"></div><div class="metric"><small>NB SEANCES</small><strong id="sessionCount">0</strong></div><div class="metric"><small>RESTE</small><strong id="sessionRest">0 $</strong></div></div><div class="last"><div class="metric"><small>DERNIER RDV</small><strong id="lastDate">Aucun</strong></div><div class="metric"><small>DEPUIS</small><strong id="daysAgo">-</strong></div></div></div></section>
<section id="mensuel" class="page"><div class="card"><h2>Mensuel</h2><div class="row"><select id="month" class="field"></select><select id="year" class="field"></select></div><div id="filters" class="filters"></div><div id="monthGrid"></div></div></section>
<nav class="nav"><button data-page="saisie" class="on"><b>✚</b>SAISIE</button><button data-page="suivi"><b>✓</b>SUIVI</button><button data-page="enveloppe"><b>◉</b>ENVELOPPE</button><button data-page="mensuel"><b>▦</b>MENSUEL</button></nav><div id="toast" class="toast"></div><dialog id="dayDialog"><h3 id="dayTitle"></h3><div id="dayContent"></div><button class="add" onclick="dayDialog.close()">Fermer</button></dialog>
<script>
'use strict';function iso(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function el(id){return document.getElementById(id)}
var PEOPLE=[['BF','#2387f5'],['CDW','#ef69b9'],['ADAM','#53b94a'],['AARON','#ff8a28']],PROS=['MASSO','NATURO','OSTEO','PSY','CHIRO','DENT','PHYSIO','X'],SET={MASSO:800,NATURO:800,OSTEO:800,PSY:1500,CHIRO:800,DENT:1500,PHYSIO:800,X:800};
var HISTORY=[['CDW','PHYSIO','perinal','2026-05-04',170],['ADAM','MASSO','bf royal','2026-05-20',150],['CDW','MASSO','kdo','2026-05-08',110],['CDW','MASSO','kdo','2026-05-21',110],['CDW','MASSO','kdo','2026-06-05',110],['CDW','MASSO','kdo','2026-07-13',110],['AARON','MASSO','bf barre','2026-06-14',60],['AARON','MASSO','bf barre','2026-06-21',60],['AARON','MASSO','bf barre','2026-06-26',60],['AARON','MASSO','bf barre','2026-07-06',60],['ADAM','MASSO','bf royal','2026-07-24',150],['ADAM','MASSO','bf royal','2026-07-11',150],['BF','MASSO','laval jess','2026-08-09',80],['AARON','MASSO','bf barre','2026-07-20',90],['AARON','MASSO','bf barre','2026-08-07',90],['AARON','MASSO','bf barre','2026-08-21',90],['BF','NATURO','bank masso','2026-07-15',110],['CDW','NATURO','bank masso','2026-07-15',110],['ADAM','NATURO','bank masso','2026-07-15',110],['AARON','NATURO','bank masso','2026-07-15',110],['BF','NATURO','bank masso','2026-08-13',110],['CDW','NATURO','bank masso','2026-08-13',110],['ADAM','NATURO','bank masso','2026-08-13',110],['AARON','NATURO','bank masso','2026-08-13',110],['ADAM','MASSO','bf royal','2026-08-29',150],['BF','MASSO','new russe','2026-09-04',100],['CDW','MASSO','KDO','2026-09-04',120],['CDW','NATURO','CYRIL','2026-09-03',120]];
var KEY='suiviSanteV3';function fresh(){return{appointments:HISTORY.map(function(x,i){return{id:'h'+i,person:x[0],professional:x[1],comment:x[2],date:x[3],paid:x[4],reimbursement:+(x[4]*.8).toFixed(2),status:'pending'}})}}function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.appointments))return x}catch(e){}return fresh()}var data=load(),entry={person:'',professional:'',date:iso(),paid:0},visible=new Set(PEOPLE.map(function(x){return x[0]}));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function money(x){return (+x||0).toLocaleString('fr-CA',{maximumFractionDigits:2})+' $'}function pc(n){var p=PEOPLE.find(function(x){return x[0]===n});return p?p[1]:'#999'}function reimb(x){return +(x*.8).toFixed(2)}function msg(x){el('toast').textContent=x;el('toast').classList.add('show');setTimeout(function(){el('toast').classList.remove('show')},1400)}
function choices(){el('people').innerHTML=PEOPLE.map(function(x){return'<button class="choice '+(entry.person===x[0]?'active':'')+'" data-v="'+x[0]+'">'+x[0]+'</button>'}).join('');el('pros').innerHTML=PROS.map(function(x){return'<button class="choice '+(entry.professional===x?'active':'')+'" data-v="'+x+'">'+x+'</button>'}).join('');el('people').querySelectorAll('button').forEach(function(b){b.onclick=function(){entry.person=b.dataset.v;choices();preview()}});el('pros').querySelectorAll('button').forEach(function(b){b.onclick=function(){entry.professional=b.dataset.v;choices();preview()}})}function preview(){el('preview').textContent=entry.person&&entry.professional&&entry.paid?'Remboursement attendu : '+money(reimb(entry.paid)):'Choisis les informations.'}function add(){if(!entry.person||!entry.professional||!entry.paid)return msg('Complete la saisie');data.appointments.push({id:'n'+Date.now(),person:entry.person,professional:entry.professional,date:entry.date,paid:entry.paid,comment:el('comment').value,reimbursement:reimb(entry.paid),status:'pending'});save();entry={person:'',professional:'',date:iso(),paid:0};el('comment').value='';el('amount').value='';choices();preview();renderFollow();renderEnvelope();renderMonth();msg('Rendez-vous ajoute')}
function renderFollow(){var a=data.appointments.filter(function(x){return x.status==='pending'}).sort(function(a,b){return b.date.localeCompare(a.date)});el('count').textContent=a.length+' remboursement(s) en attente';el('follow').innerHTML=a.map(function(x){return'<div class="follow" style="--pc:'+pc(x.person)+'" data-id="'+x.id+'"><b>'+x.person+'</b><b>'+x.professional+'</b><span>'+x.date+'</span><span>'+money(x.paid)+'</span><input type="number" value="'+x.reimbursement+'"><button class="ok">OK</button></div>'}).join('')||'<div class="empty">Aucun remboursement en attente.</div>';el('follow').querySelectorAll('.follow').forEach(function(r){var a=data.appointments.find(function(x){return x.id===r.dataset.id}),i=r.querySelector('input');i.onchange=function(){a.reimbursement=Math.max(0,+i.value||0);save();renderEnvelope()};r.querySelector('button').onclick=function(){a.reimbursement=Math.max(0,+i.value||0);a.status='validated';save();renderFollow();renderEnvelope();msg('Remboursement valide')}})}
function stats(p,pr){var pe=0,v=0;data.appointments.filter(function(x){return x.person===p&&x.professional===pr}).forEach(function(x){x.status==='pending'?pe+=+x.reimbursement:v+=+x.reimbursement});return{initial:SET[pr],pending:pe,valid:v,remaining:Math.max(0,SET[pr]-pe-v)}}function renderEnvelope(){var p=el('envPerson').value||'BF',pr=el('envPro').value||'MASSO',s=stats(p,pr),g=s.remaining/s.initial*100,o=s.pending/s.initial*100;el('remaining').textContent=money(s.remaining);el('fees').textContent='('+money(s.remaining/.8)+')';el('donut').style.background='conic-gradient(var(--green) 0 '+g+'%,var(--orange) '+g+'% '+(g+o)+'%,var(--red) '+(g+o)+'% 100%)';var f=+el('sessionFee').value||0,per=f?reimb(f):0,n=per?Math.floor(s.remaining/per):0;el('sessionCount').textContent=n;el('sessionRest').textContent=money(s.remaining-n*per);var d=data.appointments.filter(function(x){return x.person===p&&x.professional===pr}).map(function(x){return x.date}).sort().reverse()[0];el('lastDate').textContent=d||'Aucun';el('daysAgo').textContent=d?Math.max(0,Math.floor((new Date(iso())-new Date(d+'T00:00:00'))/86400000))+' jours':'-'}
var MONTHS=['JANVIER','FEVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOUT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DECEMBRE'];function renderFilters(){el('filters').innerHTML=PEOPLE.map(function(x){return'<button class="filter '+(visible.has(x[0])?'on':'')+'" style="--pc:'+x[1]+'" data-v="'+x[0]+'">'+x[0]+'</button>'}).join('');el('filters').querySelectorAll('button').forEach(function(b){b.onclick=function(){visible.has(b.dataset.v)?visible.delete(b.dataset.v):visible.add(b.dataset.v);renderFilters();renderMonth()}})}function renderMonth(){var y=+el('year').value,m=+el('month').value,first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),h=['L','M','M','J','V','S','D'].map(function(x){return'<div class="dow">'+x+'</div>'});for(var i=0;i<42;i++){var n=i-first+1;if(n<1||n>days){h.push('<div class="day"></div>');continue}var date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),a=data.appointments.filter(function(x){return x.date===date&&visible.has(x.person)}),colors=[...new Set(a.map(function(x){return pc(x.person)}))],bg=colors.length?'conic-gradient('+colors.map(function(c,j){return c+' '+(j/colors.length*100)+'% '+((j+1)/colors.length*100)+'%'}).join(',')+')':'#fff';h.push('<button class="day" data-date="'+date+'"><i class="bg" style="background:'+bg+'"></i><span class="num">'+n+'</span></button>')}el('monthGrid').innerHTML='<div class="calendar">'+h.join('')+'</div>';el('monthGrid').querySelectorAll('[data-date]').forEach(function(b){b.onclick=function(){var a=data.appointments.filter(function(x){return x.date===b.dataset.date});el('dayTitle').textContent=b.dataset.date;el('dayContent').innerHTML=a.map(function(x){return'<div class="detail" style="--pc:'+pc(x.person)+'"><b>'+x.person+'</b> - '+x.professional+'</div>'}).join('')||'Aucun rendez-vous';el('dayDialog').showModal()}})}
function show(name){document.querySelectorAll('.page').forEach(function(p){p.classList.toggle('on',p.id===name)});document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.page===name)});if(name==='suivi')renderFollow();if(name==='enveloppe')renderEnvelope();if(name==='mensuel')renderMonth();scrollTo(0,0)}function init(){el('date').value=entry.date;el('envPerson').innerHTML=PEOPLE.map(function(x){return'<option>'+x[0]+'</option>'}).join('');el('envPro').innerHTML=PROS.map(function(x){return'<option>'+x+'</option>'}).join('');el('month').innerHTML=MONTHS.map(function(x,i){return'<option value="'+i+'">'+x+'</option>'}).join('');var cy=new Date().getFullYear();el('year').innerHTML=Array.from({length:9},function(_,i){return'<option>'+(cy-4+i)+'</option>'}).join('');el('month').value=new Date().getMonth();el('year').value=cy;choices();preview();renderFollow();renderEnvelope();renderFilters();renderMonth();document.querySelectorAll('.dq').forEach(function(b){b.onclick=function(){var d=new Date();d.setDate(d.getDate()+ +b.dataset.o);entry.date=iso(d);el('date').value=entry.date}});el('od').onclick=function(){el('date').classList.toggle('hide')};el('date').onchange=function(){entry.date=this.value};document.querySelectorAll('.aq').forEach(function(b){b.onclick=function(){entry.paid=+b.dataset.a;preview()}});el('oa').onclick=function(){el('amount').classList.toggle('hide')};el('amount').oninput=function(){entry.paid=+this.value||0;preview()};el('add').onclick=add;el('envPerson').onchange=el('envPro').onchange=el('sessionFee').oninput=renderEnvelope;el('month').onchange=el('year').onchange=renderMonth;document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){show(b.dataset.page)}})}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
