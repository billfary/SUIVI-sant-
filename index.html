<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Suivi santé V3</title>
<style>
:root{--bg:#f3f6fa;--ink:#172033;--line:#c6d1df;--blue:#1976d2;--bf:#2387f5;--cdw:#ef69b9;--adam:#53b94a;--aaron:#ff8a28}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
header{height:46px;background:#142239;color:#fff;display:flex;align-items:center;padding:0 12px;font-size:16px;font-weight:800}.page{display:none;max-width:760px;margin:auto;padding:7px 7px 70px}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px}h2{margin:0 0 5px;font-size:19px}.label{margin:4px 0 2px;font-size:9px;font-weight:900;color:#687386}.grid{display:grid;gap:5px}.four{grid-template-columns:repeat(4,1fr)}.choice,.quick{min-height:34px;border:1px solid #b5c5d8;border-radius:8px;background:#fff;font-size:12px;font-weight:800;padding:4px}.choice.active,.quick.active{background:#172033;color:#fff;border-color:#172033}.field{width:100%;min-height:36px;border:1px solid #b5c5d8;border-radius:8px;padding:6px;background:#fff}.hidden{display:none}.preview{text-align:center;border:1px solid #cbd5e1;border-radius:8px;padding:6px;margin:5px 0;font-size:12px}.add{width:100%;height:38px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:900}.nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;z-index:10}.nav button{border:0;background:#fff;color:#687386;font-size:11px}.nav button.active{color:var(--blue);font-weight:900}.nav b{display:block;font-size:20px}.follow-head,.follow-row{display:grid;grid-template-columns:.65fr .9fr 1.1fr .75fr .95fr .48fr;gap:3px;align-items:center}.follow-head{font-size:9px;font-weight:900;color:#687386;padding:3px}.follow-row{border:1px solid #d2dae5;border-left:7px solid var(--person-color);border-radius:9px;padding:5px 3px;margin:5px 0;font-size:10px}.follow-row input{width:100%;min-width:0;border:1px solid #aebfd3;border-radius:5px;padding:5px 2px;text-align:center}.ok{height:30px;border:0;border-radius:6px;background:#199447;color:#fff;font-weight:900}.empty{text-align:center;color:#687386;padding:28px}.count{font-size:11px;color:#687386;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#172033;color:#fff;padding:8px 14px;border-radius:30px;display:none;z-index:20}.toast.show{display:block}
@media(max-width:520px){.follow-head{display:none}.follow-row{grid-template-columns:.62fr .88fr 1.05fr .68fr .9fr .45fr;font-size:9px}}
@media(max-height:720px){header{height:42px}.page{padding-top:4px}.choice,.quick{min-height:29px;font-size:10px}.label{margin:2px 0 1px}textarea.field{height:31px;min-height:31px}.preview{padding:4px}.add{height:34px}}
</style>
</head>
<body>
<header>Suivi santé V3</header>
<main>
<section id="saisiePage" class="page active"><div class="card"><h2>Saisie</h2>
<div class="label">QUI</div><div id="peopleButtons" class="grid four"></div>
<div class="label">QUOI</div><div id="proButtons" class="grid four"></div>
<div class="label">DATE</div><div class="grid four"><button class="quick dateQuick" data-offset="0">Aujourd'hui</button><button class="quick dateQuick" data-offset="-1">Hier</button><button class="quick dateQuick" data-offset="1">Demain</button><button id="otherDateButton" class="quick">Autre</button></div><input id="dateInput" class="field hidden" type="date">
<div class="label">FRAIS PAYÉS</div><div class="grid four"><button class="quick amountQuick" data-amount="110">110 $</button><button class="quick amountQuick" data-amount="120">120 $</button><button class="quick amountQuick" data-amount="150">150 $</button><button id="otherAmountButton" class="quick">Autre</button></div><input id="amountInput" class="field hidden" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Montant en $">
<div class="label">COMMENTAIRE</div><textarea id="commentInput" class="field" rows="1" placeholder="Commentaire facultatif"></textarea>
<div id="preview" class="preview">Choisis une personne, un professionnel et un montant.</div><button id="addButton" class="add">AJOUTER</button>
</div></section>
<section id="suiviPage" class="page"><div class="card"><h2>Suivi</h2><div id="pendingCount" class="count"></div><div class="follow-head"><span>QUI</span><span>QUOI</span><span>DATE</span><span>FRAIS</span><span>REMB. ATTENDU</span><span>OK</span></div><div id="followList"></div></div></section>
</main>
<nav class="nav"><button id="navSaisie" class="active"><b>✚</b>SAISIE</button><button id="navSuivi"><b>✓</b>SUIVI</button></nav>
<div id="toast" class="toast"></div>
<script>
'use strict';
function localISO(dateValue){var d=dateValue||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function byId(id){return document.getElementById(id)}
var PEOPLE=[{name:'BF',color:'#2387f5'},{name:'CDW',color:'#ef69b9'},{name:'ADAM',color:'#53b94a'},{name:'AARON',color:'#ff8a28'}];
var PROFESSIONALS=['MASSO','NATURO','OSTEO','PSY','CHIRO','DENT','PHYSIO','X'];
var HISTORICAL=[
['CDW','PHYSIO','perinal','2026-05-04',170],['ADAM','MASSO','bf royal','2026-05-20',150],['CDW','MASSO','kdo','2026-05-08',110],['CDW','MASSO','kdo','2026-05-21',110],['CDW','MASSO','kdo','2026-06-05',110],['CDW','MASSO','kdo','2026-07-13',110],['AARON','MASSO','bf barre','2026-06-14',60],['AARON','MASSO','bf barre','2026-06-21',60],['AARON','MASSO','bf barre','2026-06-26',60],['AARON','MASSO','bf barre','2026-07-06',60],['ADAM','MASSO','bf royal','2026-07-24',150],['ADAM','MASSO','bf royal','2026-07-11',150],['BF','MASSO','laval jess','2026-08-09',80],['AARON','MASSO','bf barre','2026-07-20',90],['AARON','MASSO','bf barre','2026-08-07',90],['AARON','MASSO','bf barre','2026-08-21',90],['BF','NATURO','bank masso','2026-07-15',110],['CDW','NATURO','bank masso','2026-07-15',110],['ADAM','NATURO','bank masso','2026-07-15',110],['AARON','NATURO','bank masso','2026-07-15',110],['BF','NATURO','bank masso','2026-08-13',110],['CDW','NATURO','bank masso','2026-08-13',110],['ADAM','NATURO','bank masso','2026-08-13',110],['AARON','NATURO','bank masso','2026-08-13',110],['ADAM','MASSO','bf royal','2026-08-29',150],['BF','MASSO','new russe','2026-09-04',100],['CDW','MASSO','KDO','2026-09-04',120],['CDW','NATURO','CYRIL','2026-09-03',120]
];
var STORAGE_KEY='suiviSanteV3';
function initialAppointments(){return HISTORICAL.map(function(x,i){return{id:'hist-'+i,person:x[0],professional:x[1],comment:x[2],date:x[3],paid:x[4],reimbursement:Number((x[4]*0.8).toFixed(2)),status:'pending'}})}
function loadData(){try{var saved=localStorage.getItem(STORAGE_KEY);if(saved){var parsed=JSON.parse(saved);if(parsed&&Array.isArray(parsed.appointments))return parsed}}catch(error){console.error('Lecture sauvegarde impossible',error)}return{appointments:initialAppointments()}}
var data=loadData();var entry={person:'',professional:'',date:localISO(),paid:0};
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function formatMoney(value){return Number(value||0).toLocaleString('fr-CA',{minimumFractionDigits:0,maximumFractionDigits:2})+' $'}
function personColor(name){var found=PEOPLE.find(function(p){return p.name===name});return found?found.color:'#94a3b8'}
function reimbursement(value){return Number((Number(value||0)*0.8).toFixed(2))}
function showToast(message){var el=byId('toast');el.textContent=message;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},1500)}
function renderChoices(){var people=byId('peopleButtons');people.innerHTML='';PEOPLE.forEach(function(p){var button=document.createElement('button');button.type='button';button.className='choice'+(entry.person===p.name?' active':'');button.textContent=p.name;button.addEventListener('click',function(){entry.person=p.name;renderChoices();renderPreview()});people.appendChild(button)});var pros=byId('proButtons');pros.innerHTML='';PROFESSIONALS.forEach(function(name){var button=document.createElement('button');button.type='button';button.className='choice'+(entry.professional===name?' active':'');button.textContent=name;button.addEventListener('click',function(){entry.professional=name;renderChoices();renderPreview()});pros.appendChild(button)})}
function renderPreview(){var el=byId('preview');if(entry.person&&entry.professional&&entry.paid>0){el.textContent='Remboursement attendu : '+formatMoney(reimbursement(entry.paid))}else{el.textContent='Choisis une personne, un professionnel et un montant.'}}
function clearEntry(){entry={person:'',professional:'',date:localISO(),paid:0};byId('dateInput').value=entry.date;byId('dateInput').classList.add('hidden');byId('amountInput').value='';byId('amountInput').classList.add('hidden');byId('commentInput').value='';document.querySelectorAll('.dateQuick,.amountQuick').forEach(function(b){b.classList.remove('active')});renderChoices();renderPreview()}
function addAppointment(){if(!entry.person||!entry.professional||!entry.date||entry.paid<=0){showToast('Complète la saisie');return}data.appointments.push({id:'new-'+Date.now(),person:entry.person,professional:entry.professional,date:entry.date,paid:Number(entry.paid),comment:byId('commentInput').value.trim(),reimbursement:reimbursement(entry.paid),status:'pending'});saveData();clearEntry();renderFollow();showToast('Rendez-vous ajouté')}
function renderFollow(){var list=byId('followList');var pending=data.appointments.filter(function(a){return a.status==='pending'}).sort(function(a,b){return b.date.localeCompare(a.date)});byId('pendingCount').textContent=pending.length+' remboursement'+(pending.length>1?'s':'')+' en attente';list.innerHTML='';if(!pending.length){list.innerHTML='<div class="empty">Aucun remboursement en attente.</div>';return}pending.forEach(function(a){var row=document.createElement('div');row.className='follow-row';row.style.setProperty('--person-color',personColor(a.person));var person=document.createElement('strong');person.textContent=a.person;var professional=document.createElement('strong');professional.textContent=a.professional;var date=document.createElement('span');date.textContent=a.date;var paid=document.createElement('span');paid.textContent=formatMoney(a.paid);var input=document.createElement('input');input.type='number';input.step='0.01';input.value=a.reimbursement;input.setAttribute('aria-label','Remboursement attendu');input.addEventListener('change',function(){a.reimbursement=Math.max(0,Number(input.value)||0);input.value=a.reimbursement;saveData()});var ok=document.createElement('button');ok.type='button';ok.className='ok';ok.textContent='OK';ok.addEventListener('click',function(){a.reimbursement=Math.max(0,Number(input.value)||0);a.status='validated';saveData();renderFollow();showToast('Remboursement validé')});row.append(person,professional,date,paid,input,ok);list.appendChild(row)})}
function showPage(name){var saisie=name==='saisie';byId('saisiePage').classList.toggle('active',saisie);byId('suiviPage').classList.toggle('active',!saisie);byId('navSaisie').classList.toggle('active',saisie);byId('navSuivi').classList.toggle('active',!saisie);if(!saisie)renderFollow();window.scrollTo(0,0)}
function initialize(){byId('dateInput').value=entry.date;renderChoices();renderPreview();renderFollow();document.querySelectorAll('.dateQuick').forEach(function(button){button.addEventListener('click',function(){var d=new Date();d.setDate(d.getDate()+Number(button.dataset.offset));entry.date=localISO(d);byId('dateInput').value=entry.date;byId('dateInput').classList.add('hidden');document.querySelectorAll('.dateQuick').forEach(function(b){b.classList.toggle('active',b===button)})})});byId('otherDateButton').addEventListener('click',function(){byId('dateInput').classList.toggle('hidden')});byId('dateInput').addEventListener('change',function(){entry.date=byId('dateInput').value});document.querySelectorAll('.amountQuick').forEach(function(button){button.addEventListener('click',function(){entry.paid=Number(button.dataset.amount);byId('amountInput').value=entry.paid;byId('amountInput').classList.add('hidden');document.querySelectorAll('.amountQuick').forEach(function(b){b.classList.toggle('active',b===button)});renderPreview()})});byId('otherAmountButton').addEventListener('click',function(){byId('amountInput').classList.toggle('hidden');byId('amountInput').focus()});byId('amountInput').addEventListener('input',function(){entry.paid=Number(byId('amountInput').value)||0;document.querySelectorAll('.amountQuick').forEach(function(b){b.classList.remove('active')});renderPreview()});byId('addButton').addEventListener('click',addAppointment);byId('navSaisie').addEventListener('click',function(){showPage('saisie')});byId('navSuivi').addEventListener('click',function(){showPage('suivi')})}
document.addEventListener('DOMContentLoaded',initialize);
</script>
</body></html>
