<!DOCTYPE html><html lang="fr-CA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Suivi santé V3.1</title><style>
:root{--bg:#f3f6fa;--ink:#172033;--line:#c6d1df;--blue:#1976d2;--green:#39aa45;--orange:#f59e0b;--red:#ef4444}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}header{height:46px;background:#142239;color:#fff;display:flex;align-items:center;padding:0 12px;font-size:16px;font-weight:800}.page{display:none;max-width:760px;margin:auto;padding:7px 7px 70px}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px}h2{margin:0 0 5px;font-size:19px}.label{margin:4px 0 2px;font-size:9px;font-weight:900;color:#687386}.grid{display:grid;gap:5px}.four{grid-template-columns:repeat(4,1fr)}.choice,.quick{min-height:34px;border:1px solid #b5c5d8;border-radius:8px;background:#fff;font-size:12px;font-weight:800;padding:4px}.choice.active,.quick.active{background:#172033;color:#fff;border-color:#172033}.field{width:100%;min-height:36px;border:1px solid #b5c5d8;border-radius:8px;padding:6px;background:#fff}.hidden{display:none}.preview{text-align:center;border:1px solid #cbd5e1;border-radius:8px;padding:6px;margin:5px 0;font-size:12px}.add{width:100%;height:38px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:900}.nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav button{border:0;background:#fff;color:#687386;font-size:10px}.nav button.active{color:var(--blue);font-weight:900}.nav b{display:block;font-size:20px}.follow-head,.follow-row{display:grid;grid-template-columns:.65fr .9fr 1.1fr .75fr .95fr .48fr;gap:3px;align-items:center}.follow-head{font-size:9px;font-weight:900;color:#687386;padding:3px}.follow-row{border:1px solid #d2dae5;border-left:7px solid var(--person-color);border-radius:9px;padding:5px 3px;margin:5px 0;font-size:10px}.follow-row input{width:100%;min-width:0;border:1px solid #aebfd3;border-radius:5px;padding:5px 2px;text-align:center}.ok{height:30px;border:0;border-radius:6px;background:#199447;color:#fff;font-weight:900}.empty{text-align:center;color:#687386;padding:28px}.count{font-size:11px;color:#687386;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:#172033;color:#fff;padding:8px 14px;border-radius:30px;display:none;z-index:20}.toast.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.donut{width:min(62vw,255px);aspect-ratio:1;border-radius:50%;margin:10px auto;display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:19%;background:#fff;border-radius:50%}.donut-center{position:relative;z-index:1;text-align:center}.donut-center strong{display:block;font-size:31px}.donut-center span{font-size:17px}.legend{display:flex;justify-content:center;gap:11px;font-size:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.metric{border:1px solid #d2dae5;border-radius:9px;padding:6px;text-align:center;min-height:66px}.metric label{display:block;font-size:9px;font-weight:900;color:#687386;min-height:25px}.metric strong{font-size:17px}.last{display:grid;grid-template-columns:2fr 1fr;gap:5px;margin-top:5px}.warning{font-size:10px;color:#a16207;text-align:center;margin-top:5px}
@media(max-width:520px){.follow-head{display:none}.follow-row{grid-template-columns:.62fr .88fr 1.05fr .68fr .9fr .45fr;font-size:9px}}@media(max-height:720px){header{height:42px}.page{padding-top:4px}.choice,.quick{min-height:29px;font-size:10px}.label{margin:2px 0 1px}textarea.field{height:31px;min-height:31px}.preview{padding:4px}.add{height:34px}.donut{width:min(40vh,220px)}}
</style></head><body><header>Suivi santé V3.1</header><main>
<section id="saisiePage" class="page active"><div class="card"><h2>Saisie</h2><div class="label">QUI</div><div id="peopleButtons" class="grid four"></div><div class="label">QUOI</div><div id="proButtons" class="grid four"></div><div class="label">DATE</div><div class="grid four"><button class="quick dateQuick" data-offset="0">Aujourd'hui</button><button class="quick dateQuick" data-offset="-1">Hier</button><button class="quick dateQuick" data-offset="1">Demain</button><button id="otherDateButton" class="quick">Autre</button></div><input id="dateInput" class="field hidden" type="date"><div class="label">FRAIS PAYÉS</div><div class="grid four"><button class="quick amountQuick" data-amount="110">110 $</button><button class="quick amountQuick" data-amount="120">120 $</button><button class="quick amountQuick" data-amount="150">150 $</button><button id="otherAmountButton" class="quick">Autre</button></div><input id="amountInput" class="field hidden" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Montant en $"><div class="label">COMMENTAIRE</div><textarea id="commentInput" class="field" rows="1" placeholder="Commentaire facultatif"></textarea><div id="preview" class="preview">Choisis une personne, un professionnel et un montant.</div><button id="addButton" class="add">AJOUTER</button></div></section>
<section id="suiviPage" class="page"><div class="card"><h2>Suivi</h2><div id="pendingCount" class="count"></div><div class="follow-head"><span>QUI</span><span>QUOI</span><span>DATE</span><span>FRAIS</span><span>REMB. ATTENDU</span><span>OK</span></div><div id="followList"></div></div></section>
<section id="enveloppePage" class="page"><div class="card"><h2>Enveloppe</h2><div class="row"><select id="envelopePerson" class="field"></select><select id="envelopeProfessional" class="field"></select></div><div id="donut" class="donut"><div class="donut-center"><strong id="remainingAmount">0 $</strong><span id="eligibleFees">(0 $)</span></div></div><div class="legend"><span><i class="dot" style="background:var(--green)"></i>Reste</span><span><i class="dot" style="background:var(--orange)"></i>En attente</span><span><i class="dot" style="background:var(--red)"></i>Validé</span></div><div class="sim"><div class="metric"><label>FRAIS SÉANCE</label><input id="sessionFee" class="field" type="number" min="0" step="0.01" inputmode="decimal"></div><div class="metric"><label>NB DE SÉANCES</label><strong id="sessionCount">0</strong></div><div class="metric"><label>RESTE ENVELOPPE</label><strong id="afterSessions">0 $</strong></div></div><div class="last"><div class="metric"><label>DERNIER RDV</label><strong id="lastAppointment">Aucun</strong></div><div class="metric"><label>DEPUIS</label><strong id="daysSince">-</strong></div></div><div class="warning">L'orange est déjà considéré comme consommé dans le montant restant.</div></div></section>
</main><nav class="nav"><button id="navSaisie" class="active"><b>✚</b>SAISIE</button><button id="navSuivi"><b>✓</b>SUIVI</button><button id="navEnveloppe"><b>◉</b>ENVELOPPE</button></nav><div id="toast" class="toast"></div><script>
'use strict';function localISO(v){var d=v||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function byId(id){return document.getElementById(id)}
var PEOPLE=[{name:'BF',color:'#2387f5'},{name:'CDW',color:'#ef69b9'},{name:'ADAM',color:'#53b94a'},{name:'AARON',color:'#ff8a28'}];var PROFESSIONALS=['MASSO','NATURO','OSTEO','PSY','CHIRO','DENT','PHYSIO','X'];var SETTINGS={MASSO:{initial:800,rate:80},NATURO:{initial:800,rate:80},OSTEO:{initial:800,rate:80},PSY:{initial:1500,rate:80},CHIRO:{initial:800,rate:80},DENT:{initial:1500,rate:80},PHYSIO:{initial:800,rate:80},X:{initial:800,rate:80}};
var HISTORICAL=[['CDW','PHYSIO','perinal','2026-05-04',170],['ADAM','MASSO','bf royal','2026-05-20',150],['CDW','MASSO','kdo','2026-05-08',110],['CDW','MASSO','kdo','2026-05-21',110],['CDW','MASSO','kdo','2026-06-05',110],['CDW','MASSO','kdo','2026-07-13',110],['AARON','MASSO','bf barre','2026-06-14',60],['AARON','MASSO','bf barre','2026-06-21',60],['AARON','MASSO','bf barre','2026-06-26',60],['AARON','MASSO','bf barre','2026-07-06',60],['ADAM','MASSO','bf royal','2026-07-24',150],['ADAM','MASSO','bf royal','2026-07-11',150],['BF','MASSO','laval jess','2026-08-09',80],['AARON','MASSO','bf barre','2026-07-20',90],['AARON','MASSO','bf barre','2026-08-07',90],['AARON','MASSO','bf barre','2026-08-21',90],['BF','NATURO','bank masso','2026-07-15',110],['CDW','NATURO','bank masso','2026-07-15',110],['ADAM','NATURO','bank masso','2026-07-15',110],['AARON','NATURO','bank masso','2026-07-15',110],['BF','NATURO','bank masso','2026-08-13',110],['CDW','NATURO','bank masso','2026-08-13',110],['ADAM','NATURO','bank masso','2026-08-13',110],['AARON','NATURO','bank masso','2026-08-13',110],['ADAM','MASSO','bf royal','2026-08-29',150],['BF','MASSO','new russe','2026-09-04',100],['CDW','MASSO','KDO','2026-09-04',120],['CDW','NATURO','CYRIL','2026-09-03',120]];
var STORAGE_KEY='suiviSanteV3';function initialAppointments(){return HISTORICAL.map(function(x,i){return{id:'hist-'+i,person:x[0],professional:x[1],comment:x[2],date:x[3],paid:x[4],reimbursement:Number((x[4]*.8).toFixed(2)),status:'pending'}})}function loadData(){try{var s=localStorage.getItem(STORAGE_KEY);if(s){var p=JSON.parse(s);if(p&&Array.isArray(p.appointments))return p}}catch(e){console.error(e)}return{appointments:initialAppointments()}}var data=loadData(),entry={person:'',professional:'',date:localISO(),paid:0};function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}function money(v){return Number(v||0).toLocaleString('fr-CA',{maximumFractionDigits:2})+' $'}function reimbursement(v){return Number((Number(v||0)*.8).toFixed(2))}function color(n){var p=PEOPLE.find(function(x){return x.name===n});return p?p.color:'#94a3b8'}function toast(m){var e=byId('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},1500)}
function renderChoices(){var pe=byId('peopleButtons');pe.innerHTML='';PEOPLE.forEach(function(p){var b=document.createElement('button');b.className='choice'+(entry.person===p.name?' active':'');b.textContent=p.name;b.onclick=function(){entry.person=p.name;renderChoices();renderPreview()};pe.appendChild(b)});var pr=byId('proButtons');pr.innerHTML='';PROFESSIONALS.forEach(function(n){var b=document.createElement('button');b.className='choice'+(entry.professional===n?' active':'');b.textContent=n;b.onclick=function(){entry.professional=n;renderChoices();renderPreview()};pr.appendChild(b)})}function renderPreview(){byId('preview').textContent=entry.person&&entry.professional&&entry.paid>0?'Remboursement attendu : '+money(reimbursement(entry.paid)):'Choisis une personne, un professionnel et un montant.'}function clearEntry(){entry={person:'',professional:'',date:localISO(),paid:0};byId('dateInput').value=entry.date;byId('dateInput').classList.add('hidden');byId('amountInput').value='';byId('amountInput').classList.add('hidden');byId('commentInput').value='';document.querySelectorAll('.dateQuick,.amountQuick').forEach(function(b){b.classList.remove('active')});renderChoices();renderPreview()}function addAppointment(){if(!entry.person||!entry.professional||!entry.date||entry.paid<=0){toast('Complète la saisie');return}data.appointments.push({id:'new-'+Date.now(),person:entry.person,professional:entry.professional,date:entry.date,paid:Number(entry.paid),comment:byId('commentInput').value.trim(),reimbursement:reimbursement(entry.paid),status:'pending'});saveData();clearEntry();renderFollow();renderEnvelope();toast('Rendez-vous ajouté')}
function renderFollow(){var list=byId('followList'),pending=data.appointments.filter(function(a){return a.status==='pending'}).sort(function(a,b){return b.date.localeCompare(a.date)});byId('pendingCount').textContent=pending.length+' remboursement'+(pending.length>1?'s':'')+' en attente';list.innerHTML='';if(!pending.length){list.innerHTML='<div class="empty">Aucun remboursement en attente.</div>';return}pending.forEach(function(a){var r=document.createElement('div');r.className='follow-row';r.style.setProperty('--person-color',color(a.person));var q=document.createElement('strong');q.textContent=a.person;var w=document.createElement('strong');w.textContent=a.professional;var d=document.createElement('span');d.textContent=a.date;var f=document.createElement('span');f.textContent=money(a.paid);var i=document.createElement('input');i.type='number';i.step='.01';i.value=a.reimbursement;i.onchange=function(){a.reimbursement=Math.max(0,Number(i.value)||0);i.value=a.reimbursement;saveData();renderEnvelope()};var o=document.createElement('button');o.className='ok';o.textContent='OK';o.onclick=function(){a.reimbursement=Math.max(0,Number(i.value)||0);a.status='validated';saveData();renderFollow();renderEnvelope();toast('Remboursement validé')};r.append(q,w,d,f,i,o);list.appendChild(r)})}
function envelopeStats(person,professional){var set=SETTINGS[professional],pending=0,validated=0;data.appointments.filter(function(a){return a.person===person&&a.professional===professional}).forEach(function(a){if(a.status==='validated')validated+=Number(a.reimbursement||0);else pending+=Number(a.reimbursement||0)});return{initial:set.initial,rate:set.rate,pending:pending,validated:validated,remaining:Math.max(0,set.initial-pending-validated)}}function renderEnvelope(){var person=byId('envelopePerson').value||'BF',professional=byId('envelopeProfessional').value||'MASSO',s=envelopeStats(person,professional),total=Math.max(1,s.initial),green=s.remaining/total*100,orange=s.pending/total*100;byId('remainingAmount').textContent=money(s.remaining);byId('eligibleFees').textContent='('+money(s.remaining/(s.rate/100))+')';byId('donut').style.background='conic-gradient(var(--green) 0 '+green+'%,var(--orange) '+green+'% '+(green+orange)+'%,var(--red) '+(green+orange)+'% 100%)';var fee=Number(byId('sessionFee').value)||0,per=fee?reimbursement(fee):0,count=per?Math.floor(s.remaining/per):0;byId('sessionCount').textContent=count;byId('afterSessions').textContent=money(s.remaining-count*per);var dates=data.appointments.filter(function(a){return a.person===person&&a.professional===professional}).map(function(a){return a.date}).sort().reverse(),last=dates[0];byId('lastAppointment').textContent=last||'Aucun';if(last){var days=Math.floor((new Date(localISO())-new Date(last+'T00:00:00'))/86400000);byId('daysSince').textContent=days>=0?days+' jours':'À venir'}else byId('daysSince').textContent='-'}
function showPage(name){['saisie','suivi','enveloppe'].forEach(function(n){byId(n+'Page').classList.toggle('active',n===name);byId('nav'+n.charAt(0).toUpperCase()+n.slice(1)).classList.toggle('active',n===name)});if(name==='suivi')renderFollow();if(name==='enveloppe')renderEnvelope();window.scrollTo(0,0)}function initialize(){byId('dateInput').value=entry.date;byId('envelopePerson').innerHTML=PEOPLE.map(function(p){return'<option>'+p.name+'</option>'}).join('');byId('envelopeProfessional').innerHTML=PROFESSIONALS.map(function(p){return'<option>'+p+'</option>'}).join('');renderChoices();renderPreview();renderFollow();renderEnvelope();document.querySelectorAll('.dateQuick').forEach(function(b){b.onclick=function(){var d=new Date();d.setDate(d.getDate()+Number(b.dataset.offset));entry.date=localISO(d);byId('dateInput').value=entry.date;byId('dateInput').classList.add('hidden');document.querySelectorAll('.dateQuick').forEach(function(x){x.classList.toggle('active',x===b)})}});byId('otherDateButton').onclick=function(){byId('dateInput').classList.toggle('hidden')};byId('dateInput').onchange=function(){entry.date=this.value};document.querySelectorAll('.amountQuick').forEach(function(b){b.onclick=function(){entry.paid=Number(b.dataset.amount);byId('amountInput').value=entry.paid;byId('amountInput').classList.add('hidden');document.querySelectorAll('.amountQuick').forEach(function(x){x.classList.toggle('active',x===b)});renderPreview()}});byId('otherAmountButton').onclick=function(){byId('amountInput').classList.toggle('hidden');byId('amountInput').focus()};byId('amountInput').oninput=function(){entry.paid=Number(this.value)||0;document.querySelectorAll('.amountQuick').forEach(function(x){x.classList.remove('active')});renderPreview()};byId('addButton').onclick=addAppointment;byId('navSaisie').onclick=function(){showPage('saisie')};byId('navSuivi').onclick=function(){showPage('suivi')};byId('navEnveloppe').onclick=function(){showPage('enveloppe')};byId('envelopePerson').onchange=renderEnvelope;byId('envelopeProfessional').onchange=renderEnvelope;byId('sessionFee').oninput=renderEnvelope}document.addEventListener('DOMContentLoaded',initialize);
</script></body></html>
