<script>
'use strict';const $=x=>document.getElementById(x),KEY='suiviSanteV3',P=[['BF','#2387f5'],['CDW','#ef69b9'],['ADAM','#53b94a'],['AARON','#ff8a28']],DEF=[['MASSO','M',800],['NATURO','N',800],['OSTEO','O',800],['PSY','Ψ',1500],['CHIRO','C',800],['DENT','D',1500],['PHYSIO','P',800],['AUTRE','X',800]].map(x=>({name:x[0],letter:x[1],initial:x[2],rate:80,group:''})),MON=['JANV','FÉVR','MARS','AVRI','MAI','JUIN','JUIL','AOÛT','SEPT','OCTO','NOVE','DÉCE'],FULL=['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];function iso(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function fd(s){if(!s)return'';let[y,m,d]=s.split('-');return`${d} ${MON[+m-1]} ${y.slice(-2)}`}let D=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.appointments){x.pros=(x.pros||DEF).map(({cap,...p})=>p);x.pros.forEach(p=>{if(p.name==='X')p.name='AUTRE'});x.appointments.forEach(a=>{if(a.professional==='X')a.professional='AUTRE'});return x}}catch(e){}return{appointments:[],pros:DEF}})(),E={person:'',professional:'',date:iso(),paid:0},visible=new Set(P.map(x=>x[0])),selectedId,editId;const save=()=>localStorage.setItem(KEY,JSON.stringify(D)),money=x=>(+x||0).toLocaleString('fr-CA',{maximumFractionDigits:2})+' $',pc=n=>(P.find(x=>x[0]===n)||P[0])[1],gp=n=>D.pros.find(x=>x.name===n)||D.pros[0],calc=(a,p)=>+(a*p.rate/100).toFixed(2);
function choices(){$('people').innerHTML=P.map(x=>`<button class="choice ${E.person===x[0]?'on':''}" data-v="${x[0]}">${x[0]}</button>`).join('');$('pros').innerHTML=D.pros.map(x=>`<button class="choice ${E.professional===x.name?'on':''}" data-v="${x.name}">${x.name}</button>`).join('');$('people').querySelectorAll('button').forEach(b=>b.onclick=()=>{E.person=b.dataset.v;choices();preview()});$('pros').querySelectorAll('button').forEach(b=>b.onclick=()=>{E.professional=b.dataset.v;choices();preview()})}function preview(){if(E.person&&E.professional&&E.paid){$('refundPreview').classList.remove('hide');$('refundPreview').textContent='Remboursement attendu : '+money(calc(E.paid,gp(E.professional)))}else $('refundPreview').classList.add('hide')}function resetEntry(){E={person:'',professional:'',date:iso(),paid:0};$('date').value=E.date;$('amount').value='';$('amount').classList.add('hide');$('comment').value='';document.querySelectorAll('.dq,.aq,#od,#oa').forEach(b=>b.classList.remove('on'));choices();preview()}function selects(){let ev=$('envPro').value,jv=$('jPro').value;$('envPerson').innerHTML=P.map(x=>`<option>${x[0]}</option>`).join('');$('envPro').innerHTML=D.pros.map(x=>`<option>${x.name}</option>`).join('');$('jPerson').innerHTML='<option value="">TOUS : QUI</option>'+P.map(x=>`<option>${x[0]}</option>`).join('');$('jPro').innerHTML='<option value="">TOUS : QUOI</option>'+D.pros.map(x=>`<option>${x.name}</option>`).join('');if(D.pros.some(x=>x.name===ev))$('envPro').value=ev;if(D.pros.some(x=>x.name===jv))$('jPro').value=jv}
function follow(){let a=D.appointments.filter(x=>x.status==='pending').sort((a,b)=>b.date.localeCompare(a.date));$('count').textContent=a.length+' remboursement(s) en attente';$('follow').innerHTML=a.map(x=>`<div class="follow" style="--pc:${pc(x.person)}" data-id="${x.id}"><b>${x.person}</b><b>${x.professional}</b><span>${fd(x.date)}</span><span>${money(x.paid)}</span><input value="${x.reimbursement}" type="number"><button class="ok">OK</button></div>`).join('')||'<div class="empty">Aucun remboursement.</div>';$('follow').querySelectorAll('.follow').forEach(r=>{let a=D.appointments.find(x=>x.id===r.dataset.id),i=r.querySelector('input');i.onchange=()=>{a.reimbursement=+i.value||0;save();envelope()};r.querySelector('button').onclick=()=>{a.reimbursement=+i.value||0;a.status='validated';save();render()}})}function envelope(){let person=$('envPerson').value||'BF',p=gp($('envPro').value),gs=p.group?D.pros.filter(x=>x.group===p.group):[p],names=new Set(gs.map(x=>x.name)),ini=p.group?Math.max(...gs.map(x=>+x.initial)):+p.initial,pend=0,val=0;D.appointments.filter(x=>x.person===person&&names.has(x.professional)).forEach(x=>x.status==='pending'?pend+=+x.reimbursement:val+=+x.reimbursement);let rem=Math.max(0,ini-pend-val),g=ini?rem/ini*100:0,o=ini?pend/ini*100:0;$('remaining').textContent=money(rem);$('fees').textContent='('+money(p.rate?rem/(p.rate/100):0)+')';$('initial').textContent=money(ini);$('pending').textContent=money(pend);$('validated').textContent=money(val);$('donut').style.background=`conic-gradient(var(--green) 0 ${g}%,var(--orange) ${g}% ${g+o}%,var(--red) ${g+o}% 100%)`;let f=+$('sessionFee').value||0,per=f?calc(f,p):0,n=per?Math.floor(rem/per):0;$('sessionCount').textContent=n;$('sessionRest').textContent=money(rem-n*per);let d=D.appointments.filter(x=>x.person===person&&x.professional===p.name).map(x=>x.date).sort().reverse()[0];$('lastDate').textContent=d?fd(d):'Aucun';$('daysAgo').textContent=d?Math.max(0,Math.floor((new Date(iso())-new Date(d+'T00:00: function openDay(d){let a=D.appointments.filter(x=>x.date===d);$('dayTitle').textContent=fd(d);$('dayContent').innerHTML=a.map(x=>`<div class="detail" style="--pc:${pc(x.person)}"><b>${x.person} • ${x.professional}</b><br>${x.comment||'Aucun commentaire'}</div>`).join('')||'Aucun';$('dayDialog').showModal()}function updateMonthTitle(){$('monthTitle').textContent=FULL[+$('month').value]+' '+$('year').value}function changeMonth(delta){let d=new Date(+$('year').value,+$('month').value+delta,1);if(!$('year').querySelector(`option[value="${d.getFullYear()}"]`))$('year').insertAdjacentHTML('beforeend',`<option>${d.getFullYear()}</option>`);$('month').value=d.getMonth();$('year').value=d.getFullYear();month()}function month(){let y=+$('year').value,m=+$('month').value,f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),h=['L','M','M','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`);for(let i=0;i<42;i++){let d=i-f+1;if(d<1||d>n){h.push('<div class="day"></div>');continue}let z=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=D.appointments.filter(x=>x.date===z&&visible.has(x.person)),cs=[...new Set(a.map(x=>pc(x.person)))],bg=cs.length?`conic-gradient(${cs.map((c,j)=>`${c} ${j/cs.length*100}% ${(j+1)/cs.length*100}%`).join(',')})`:'#fff';h.push(`<button class="day" data-d="${z}"><i style="background:${bg}"></i><span>${d}</span></button>`)}$('monthGrid').innerHTML=`<div class="calendar">${h.join('')}</div>`;$('monthGrid').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>openDay(b.dataset.d));$('monthSummary').innerHTML=P.map(p=>{let a=D.appointments.filter(x=>x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)&&x.person===p[0]&&visible.has(p[0])),c={};a.forEach(x=>c[gp(x.professional).letter]=(c[gp(x.professional).letter]||0)+1);return`<div class="personSummary" style="--pc:${p[1]}"><div class="who">${p[0]}<br>${a.length} RDV</div><div>${Object.entries(c).map(x=>`${x[0]} : ${x[1]}`).join(' • ')||'Aucun rendez-vous'}</div></div>`}).join('');updateMonthTitle()}
function annual(scroll=true){let y=+$('annualYear').value,d=new Date(y,0,1),h='',lm=-1;while(d.getFullYear()===y){let z=iso(d);if(d.getMonth()!==lm){lm=d.getMonth();h+=`<div class="annualMonth">${MON[lm]}</div>`}let a=D.appointments.filter(x=>x.date===z);h+=`<div class="annualRow ${z===iso()?'today':''}" id="day-${z}" data-d="${z}"><b>${['D','L','M','M','J','V','S'][d.getDay()]}</b><span>${fd(z)}</span><span>${a.map(x=>`<b class="letter" style="--pc:${pc(x.person)}">${gp(x.professional).letter}</b>`).join('')}</span></div>`;d.setDate(d.getDate()+1)}$('annualList').innerHTML=h;$('annualList').querySelectorAll('[data-d]').forEach(r=>r.onclick=()=>openDay(r.dataset.d));if(scroll&&y===new Date().getFullYear())requestAnimationFrame(()=>document.getElementById('day-'+iso())?.scrollIntoView({block:'center'}))}
function journal(){let a=D.appointments.filter(x=>(!$('jPerson').value||x.person===$('jPerson').value)&&(!$('jPro').value||x.professional===$('jPro').value)).sort((a,b)=>a.date.localeCompare(b.date));$('journalList').innerHTML=a.map(x=>`<div class="journal" style="--pc:${pc(x.person)}"><div class="jtop"><span>${fd(x.date)}</span><span>${x.person}</span><span>${x.professional}</span></div><div class="jcomment">${x.comment||'Aucun commentaire'}</div><button class="more" data-id="${x.id}">⋮</button></div>`).join('')||'<div class="empty">Aucun rendez-vous.</div>';$('journalList').querySelectorAll('.more').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;$('actionMenu').classList.add('show')})}function settings(){$('settingsRows').innerHTML=D.pros.map((p,i)=>`<div class="srow" data-i="${i}"><input data-k="name" value="${p.name}"><input data-k="letter" maxlength="2" value="${p.letter}"><input data-k="initial" type="number" value="${p.initial}"><input data-k="rate" type="number" value="${p.rate}"><input data-k="group" maxlength="2" value="${p.group||''}"><button>×</button></div>`).join('');$('settingsRows').querySelectorAll('.srow').forEach(r=>{r.querySelectorAll('input').forEach(i=>i.onchange=()=>{let p=D.pros[+r.dataset.i],k=i.dataset.k,old=p.name;p[k]=['initial','rate'].includes(k)?+i.value||0:i.value.toUpperCase();if(k==='name')D.appointments.forEach(a=>{if(a.professional===old)a.professional=p.name});save();render()});r.querySelector('button').onclick=()=>{D.pros.splice(+r.dataset.i,1);save();render()}})}function render(){selects();choices();preview();follow();envelope();month();annual(false);journal();settings()}
function init(){let cy=new Date().getFullYear();$('month').innerHTML=FULL.map((x,i)=>`<option value="${i}">${x}</option>`).join('');$('month').value=new Date().getMonth();[$('year'),$('annualYear')].forEach(s=>{s.innerHTML=Array.from({length:9},(_,i)=>`<option>${cy-4+i}</option>`).join('');s.value=cy});$('filters').innerHTML=P.map(x=>`<button class="filter on" style="--pc:${x[1]}" data-v="${x[0]}">${x[0]}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{visible.has(b.dataset.v)?visible.delete(b.dataset.v):visible.add(b.dataset.v);b.classList.toggle('on');month()});$('prevMonth').onclick=()=>changeMonth(-1);$('nextMonth').onclick=()=>changeMonth(1);$('monthTitle').onclick=()=>$('monthSelects').classList.toggle('show');$('month').onchange=$('year').onchange=()=>{$('monthSelects').classList.remove('show');month()};document.querySelectorAll('.dq').forEach(b=>b.onclick=()=>{let d=new Date();d.setDate(d.getDate()+ +b.dataset.o);E.date=iso(d);$('date').value=E.date;document.querySelectorAll('.dq,#od').forEach(x=>x.classList.toggle('on',x===b))});$('od').onclick=()=>{$('od').classList.add('on');document.querySelectorAll('.dq').forEach(x=>x.classList.remove('on'));$('date').focus()};$('date').onchange=()=>E.date=$('date').value;document.querySelectorAll('.aq').forEach(b=>b.onclick=()=>{E.paid=+b.dataset.a;document.querySelectorAll('.aq,#oa').forEach(x=>x.classList.toggle('on',x===b));preview()});$('oa').onclick=()=>{$('amount').classList.remove('hide');$('oa').classList.add('on');document.querySelectorAll('.aq').forEach(x=>x.classList.remove('on'));$('amount').focus()};$('amount').oninput=()=>{E.paid=+$('amount').value||0;preview()};$('reset').onclick=resetEntry;$('add').onclick=()=>{if(!E.person||!E.professional||!E.paid)return alert('Complète la saisie');D.appointments.push({id:'n'+Date.now(),person:E.person,professional:E.professional,date:E.date,paid:E.paid,comment:$('comment').value,reimbursement:calc(E.paid,gp(E.professional)),status:'pending'});save();resetEntry();render()};$('menuCancel').onclick=()=>$('actionMenu').classList.remove('show');$('menuEdit').onclick=()=>{let a=D.appointments.find(x=>x.id===selectedId);editId=a.id;$('editDate').value=a.date;$('editPaid').value=a.paid;$('editReimb').value=a.reimbursement;$('editComment').value=a.comment;$('actionMenu').classList.remove('show');$('editDialog').showModal()};$('menuDelete').onclick=()=>{if(confirm('Supprimer ce rendez-vous ?')){D.appointments=D.appointments.filter(x=>x.id!==selectedId);save();render()}$('actionMenu').classList.remove('show')};$('saveEdit').onclick=()=>{let a=D.appointments.find(x=>x.id===editId);a.date=$('editDate').value;a.paid=+$('editPaid').value||0;a.reimbursement=+$('editReimb').value||0;a.comment=$('editComment').value;save();$('editDialog').close();render()};$('addPro').onclick=()=>{D.pros.push({name:'NOUVEAU',letter:'X',initial:800,rate:80,group:''});save();render()};$('exportBtn').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='sauvegarde-sante.json';a.click()};$('importFile').onchange=e=>{let r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);D.pros=(D.pros||DEF).map(({cap,...p})=>p);save();render()}catch(x){alert('Fichier invalide')}};r.readAsText(e.target.files[0])};$('envPerson').onchange=$('envPro').onchange=$('sessionFee').oninput=envelope;$('annualYear').onchange=()=>annual(true);$('jPerson').onchange=$('jPro').onchange=journal;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.p==='annuel')annual(true);scrollTo(0,0)});resetEntry();render()}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
